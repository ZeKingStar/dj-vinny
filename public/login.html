<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2" sizes="48x48"><link rel="icon" type="image/svg+xml" href="/vinny.svg?v=2"><link rel="apple-touch-icon" href="/vinny-48.png?v=2"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="login.pageTitle">DJ Vinny : connexion hôte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script></head>
<body><div class="bg-anim"></div>
<div class="wrap" style="max-width:380px;padding-top:15vh">
  <div class="card">
    <h1 style="margin:0 0 6px">DJ Vinny</h1>
    <p class="muted" data-i18n="login.sub">Connexion au dashboard</p>
    <form id="f"><input type="password" id="pw" placeholder="Mot de passe" data-i18n-ph="login.password" autofocus>
    <p id="err" class="muted" style="color:#ff6b6b"></p>
    <button style="width:100%" data-i18n="login.enter">Entrer</button></form>
  </div>
</div>
<script>
setLang(hostLang());
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-lang': LANG }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) { const n = new URLSearchParams(location.search).get('next'); location.href = n === '/remote' ? '/remote' : '/host'; } else document.getElementById('err').textContent = (await r.json()).error;
};
</script></body></html>
