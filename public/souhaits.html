<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2" sizes="48x48"><link rel="icon" type="image/svg+xml" href="/vinny.svg?v=2"><link rel="apple-touch-icon" href="/vinny-48.png?v=2"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="g.wish.pageTitle">DJ Vinny : tes chansons pour la soirée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/i18n.js?p=guest"></script></head>
<body><div class="bg-anim"></div>
<div class="wrap">
  <div class="hero">
    <i class="deco d1"></i><i class="deco d2"></i><i class="deco d3"></i><i class="deco d4"></i>
    <h1 data-i18n="g.wish.title">Tes chansons pour la soirée</h1>
  </div>
  <div class="card">
    <p class="muted" style="margin-top:0" data-i18n="g.wish.intro">Dis-nous les 3 chansons qui te font toujours danser. On s'en sert pour préparer la musique.</p>
    <div id="evinfo" hidden></div>
    <form id="f">
      <label for="name" class="muted" style="font-weight:700" data-i18n="g.wish.nameLabel">Ton prénom (optionnel)</label>
      <input type="text" id="name" maxlength="20" style="margin:6px 0 14px" autocomplete="given-name">
      <label for="w1" class="muted" style="font-weight:700" data-i18n="g.wish.song1">Chanson 1 (titre et artiste)</label>
      <input type="text" id="w1" maxlength="80" placeholder="Ex. September, Earth Wind & Fire" data-i18n-ph="g.wish.example" style="margin:6px 0 14px" autocomplete="off">
      <label for="w2" class="muted" style="font-weight:700" data-i18n="g.wish.song2">Chanson 2</label>
      <input type="text" id="w2" maxlength="80" style="margin:6px 0 14px" autocomplete="off">
      <label for="w3" class="muted" style="font-weight:700" data-i18n="g.wish.song3">Chanson 3</label>
      <input type="text" id="w3" maxlength="80" style="margin:6px 0 14px" autocomplete="off">
      <button style="width:100%;min-height:52px;font-size:17px" data-i18n="g.wish.send">Envoyer mes chansons</button>
    </form>
    <p id="done" class="muted" hidden data-i18n="g.wish.done">Merci ! Tes chansons sont notées.</p>
  </div>
</div>
<script src="/anim.js"></script>
<script>
// code de la soirée (lu dans le QR, puis retiré de l'adresse)
let ev = '';
try { const u = new URL(location.href), e = u.searchParams.get('e'); if (e) { localStorage.djEvent = e; history.replaceState(null, '', u.pathname); } ev = localStorage.djEvent || ''; } catch {}
try { setLang(localStorage.djEvLang || 'fr'); } catch { setLang('fr'); } // langue de l'événement, gardée de la dernière visite
let guestId = localStorage.guestId;
if (!guestId) guestId = localStorage.guestId = 'g' + Math.random().toString(36).slice(2, 12);
(async () => {
  try {
    const r = await fetch('/api/state?e=' + encodeURIComponent(ev), { headers: { 'x-event': ev, 'x-lang': LANG } }), j = await r.json(), e = j && j.event;
    if (!e) return;
    if (e.lang) { try { localStorage.djEvLang = e.lang; } catch {} setLang(e.lang); }
    const day = new Date(e.date + 'T12:00:00').toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' });
    const box = document.getElementById('evinfo'); box.hidden = false;
    box.innerHTML = '<h2 style="margin:0 0 4px">' + esc(e.name) + '</h2><div class="muted" style="margin-bottom:12px">' + esc(day) + ' · ' + esc(e.start) + (e.place ? ' · ' + esc(e.place) : '') + '</div>';
    if (e.status === 'ended') { document.getElementById('f').hidden = true; box.innerHTML += '<p style="font-weight:700">' + esc(e.thanks || t('g.thanks')) + '</p>'; }
  } catch {}
})();
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const texts = ['w1', 'w2', 'w3'].map(id => document.getElementById(id).value.trim()).filter(t => t.length >= 3);
  if (!texts.length) return toast(t('g.wish.atLeastOne'));
  const name = document.getElementById('name').value;
  let ok = 0, err = '';
  for (const text of texts) {
    const r = await fetch('/api/wish', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-event': ev, 'x-lang': LANG }, body: JSON.stringify({ text, name, guestId }) });
    if (r.ok) ok++; else err = (await r.json()).error;
  }
  if (ok) { confetti(); document.getElementById('f').hidden = true; document.getElementById('done').hidden = false; }
  else toast(err || t('c.error'));
};
</script></body></html>
