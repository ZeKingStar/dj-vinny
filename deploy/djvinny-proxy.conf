proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
# Flux temps réel (SSE) : pas de mise en tampon, connexion longue
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
# Les routes invités n'ont que de petits corps de requête
client_max_body_size 16k;
# Limites larges : tous les invités d'un même Wi-Fi partagent une adresse IP (zones dans conf.d/djvinny-limits.conf)
limit_req zone=djv_req burst=100 nodelay;
limit_req_status 429;
limit_conn djv_conn 250;
limit_conn_status 429;
