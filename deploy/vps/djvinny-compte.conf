# /etc/nginx/sites-enabled/djvinny-compte.conf : portail de paiement compte.djvinny.ca (fichiers statiques dans /var/www/compte.djvinny.ca)
# Le nom exact a priorité sur le joker *.djvinny.ca des clients (djvinny-clients.conf). Même certificat générique que le site.
server {
    listen 80;
    listen [::]:80;
    server_name compte.djvinny.ca;
    return 301 https://compte.djvinny.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name compte.djvinny.ca;
    ssl_certificate /etc/letsencrypt/live/djvinny.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djvinny.ca/privkey.pem;

    root /var/www/compte.djvinny.ca;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /config.js {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri =404;
    }
}
