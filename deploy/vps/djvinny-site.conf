# /etc/nginx/sites-enabled/djvinny-site.conf : page de vente de djvinny.ca (fichiers statiques dans /var/www/djvinny.ca)
# Installé par installer.sh. Les sous-domaines des clients sont dans djvinny-clients.conf (*.djvinny.ca) ;
# les noms exacts ci-dessous ont priorité sur ce joker, donc www ne tombe jamais sur un client.
server {
    listen 80;
    listen [::]:80;
    server_name djvinny.ca www.djvinny.ca;
    return 301 https://djvinny.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.djvinny.ca;
    ssl_certificate /etc/letsencrypt/live/djvinny.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djvinny.ca/privkey.pem;
    return 301 https://djvinny.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name djvinny.ca;
    ssl_certificate /etc/letsencrypt/live/djvinny.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djvinny.ca/privkey.pem;

    root /var/www/djvinny.ca;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    # Téléchargement débranché en attendant que tout soit prêt : retour à la page.
    # Pour le remettre : return 302 https://github.com/ZeKingStar/dj-vinny/releases/latest/download/DJ-Vinny-windows.zip;
    # et LIENS.telecharger = '/telecharger' dans index.html
    location = /telecharger {
        return 302 /;
    }
    location ~* \.(mp4|jpg|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri =404;
    }
}
