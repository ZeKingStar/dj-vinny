# /etc/nginx/conf.d/djvinny-limits.conf : zones de limitation pour djvinny.korvia.ca
limit_req_zone $binary_remote_addr zone=djv_req:2m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=djv_conn:2m;
# Page de connexion de l'hôte (télécommande) : très peu d'essais par minute et par adresse
limit_req_zone $binary_remote_addr zone=djv_login:1m rate=5r/m;
